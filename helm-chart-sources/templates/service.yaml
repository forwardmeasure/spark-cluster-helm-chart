apiVersion: v1
kind: Service
metadata:
  name: spark-master-service
  labels:
    app: spark
    component: master
spec:
  type: {{ .Values.master.service.type }}
  ports:
    - name: spark-cluster
      port: {{ .Values.master.service.port }}
      targetPort: {{ .Values.master.service.port }}
    - name: spark-ui
      port: {{ .Values.master.service.uiPort }}
      targetPort: {{ .Values.master.service.uiPort }}
      {{- if eq .Values.master.service.type "NodePort" }}
      nodePort: {{ .Values.master.service.nodePort }}
      {{- end }}
  selector:
    app: spark
    component: master
