apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  labels:
    app: spark
    component: worker
    {{- with .Values.labels }}
    {{ toYaml . | indent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: spark
      component: worker
  template:
    metadata:
      labels:
        app: spark
        component: worker
    spec:
      containers:
        - name: spark-worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://{{ .Values.master.service.name }}:{{ .Values.master.service.port }}
          env:
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: SPARK_WORKER_CORES
              value: {{ .Values.worker.cores | quote }}
            - name: SPARK_WORKER_MEMORY
              value: {{ .Values.worker.memory | quote }}
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.worker.ui.enabled }}
            - name: SPARK_WORKER_WEBUI_PORT
              value: "{{ .Values.worker.ui.port | quote }}"
            {{- end }}
          
          ports:
            {{- if .Values.worker.ui.enabled }}
            - name: webui
              containerPort: {{ .Values.worker.ui.port }}
            {{- end }}
          
          resources:
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu }}
              memory: {{ .Values.worker.resources.limits.memory }}
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu }}
              memory: {{ .Values.worker.resources.requests.memory }}
          
          volumeMounts:
            - name: spark-storage
              mountPath: {{ .Values.persistence.mountPath }}

      volumes:
        - name: spark-storage
          persistentVolumeClaim:
            claimName: {{- if .Values.persistence.existingClaim }}
                          {{ .Values.persistence.existingClaim }}
                        {{- else if .Values.persistence.shared }}
                          {{ .Values.persistence.sharedClaim }}
                        {{- else }}
                          {{ .Values.persistence.workerClaim }}
                        {{- end }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
