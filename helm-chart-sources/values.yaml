# Configuration for Spark Master
master:
  image:
    repository: spark-master
    tag: "4.0.0-preview2-scala2.13-java21-python3-ubuntu"
  replicas: 1
  service:
    type: ClusterIP
    port: 7077
  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "1000m"
      memory: "2Gi"

# Configuration for Spark Workers
worker:
  image:
    repository: spark-worker
    tag: "4.0.0-preview2-scala2.13-java21-python3-ubuntu"
  replicas: 2
  resources:
    limits:
      cpu: "1500m"
      memory: "3Gi"
    requests:
      cpu: "750m"
      memory: "1.5Gi"

# Persistent Volume Claim
persistence:
  enabled: true
  storageClass: "manual"
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  existingClaim: "" # Option to provide an existing PVC

# Custom Labels
labels: {}

